<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d"><title id="t">RollScreen 0.8.2 のWindows画面</title><desc id="d">接続状態、画質、PC音声、入力許可、接続URL、QRコードを表示するRollScreenの画面構成。</desc><defs><linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff4ff"/><stop offset="1" stop-color="#efe7ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".16"/></filter></defs><rect width="1100" height="720" rx="34" fill="#eaf0f8"/><g filter="url(#s)"><rect x="28" y="25" width="1044" height="670" rx="26" fill="#f7f9fc"/><rect x="28" y="25" width="1044" height="70" rx="26" fill="url(#head)"/><rect x="28" y="71" width="1044" height="24" fill="url(#head)"/><circle cx="66" cy="61" r="16" fill="#54c7ef"/><rect x="62" y="43" width="28" height="22" rx="4" fill="#6f72ea"/><rect x="53" y="52" width="26" height="22" rx="4" fill="#2b5ed0"/><text x="108" y="68" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#23385e">RollScreen</text><text x="49" y="121" font-family="Segoe UI,Arial" font-size="17" fill="#415471">スマホ / タブレットを、Windowsのもう1つの画面に。</text><rect x="56" y="154" width="525" height="500" rx="26" fill="#fff" stroke="#d8e2ef"/><rect x="609" y="154" width="435" height="500" rx="26" fill="#fff" stroke="#d8e2ef"/></g><rect x="81" y="183" width="184" height="7" rx="4" fill="#5db3e8"/><text x="81" y="222" font-family="Segoe UI,Arial" font-size="25" fill="#324867">接続</text><text x="81" y="259" font-family="Segoe UI,Arial" font-size="20" fill="#53657d">Windows側の画面を準備しています…</text><text x="81" y="301" font-family="Segoe UI,Arial" font-size="17" fill="#5f718a">QRコードはそのまま使えます。RollScreen画面が有効になるまで</text><text x="81" y="326" font-family="Segoe UI,Arial" font-size="17" fill="#5f718a">自動で再試行します。</text><rect x="81" y="352" width="473" height="176" rx="18" fill="#f8fbff" stroke="#dfe7f2"/><text x="102" y="392" font-family="Segoe UI,Arial" font-size="19" fill="#3e536f">画質</text><rect x="176" y="366" width="214" height="42" rx="8" fill="#fff" stroke="#cad6e5"/><text x="194" y="394" font-family="Segoe UI,Arial" font-size="17" fill="#63758d">低遅延 720p60</text><rect x="405" y="366" width="107" height="42" rx="10" fill="#5d7af0"/><text x="458" y="393" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#fff">再接続</text><text x="103" y="441" font-family="Segoe UI,Arial" font-size="18" fill="#435874">☑ PC音声を送る</text><text x="103" y="476" font-family="Segoe UI,Arial" font-size="18" fill="#435874">☐ 入力を許可（タッチ / マウス / キーボード）</text><text x="81" y="562" font-family="Segoe UI,Arial" font-size="17" fill="#5f718a">接続URL</text><rect x="81" y="578" width="473" height="51" rx="10" fill="#f4f7fb"/><text x="96" y="609" font-family="Consolas,monospace" font-size="15" fill="#3c5373">http://192.168.11.xxx:38471/view/…</text><text x="643" y="211" font-family="Segoe UI,Arial" font-size="24" fill="#314864">ブラウザで接続</text><text x="643" y="247" font-family="Segoe UI,Arial" font-size="18" fill="#5b6d85">iPhone / iPad / Android / PC</text><rect x="677" y="286" width="300" height="300" rx="20" fill="#fff" stroke="#d8e0eb"/><g fill="#111827"><rect x="705" y="314" width="70" height="70"/><rect x="717" y="326" width="46" height="46" fill="#fff"/><rect x="728" y="337" width="24" height="24"/><rect x="879" y="314" width="70" height="70"/><rect x="891" y="326" width="46" height="46" fill="#fff"/><rect x="902" y="337" width="24" height="24"/><rect x="705" y="488" width="70" height="70"/><rect x="717" y="500" width="46" height="46" fill="#fff"/><rect x="728" y="511" width="24" height="24"/><rect x="800" y="314" width="22" height="22"/><rect x="836" y="314" width="22" height="44"/><rect x="800" y="352" width="44" height="22"/><rect x="858" y="368" width="22" height="44"/><rect x="800" y="390" width="22" height="22"/><rect x="836" y="406" width="44" height="22"/><rect x="784" y="438" width="44" height="22"/><rect x="844" y="450" width="22" height="44"/><rect x="890" y="438" width="44" height="22"/><rect x="800" y="484" width="22" height="44"/><rect x="836" y="500" width="22" height="22"/><rect x="875" y="516" width="59" height="22"/></g><rect x="659" y="607" width="324" height="36" rx="10" fill="#f7f9fd" stroke="#d7e0ec"/><text x="821" y="631" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#50647f">同じWi-Fi / LANからQRまたはURLで接続</text></svg>