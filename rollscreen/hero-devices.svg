<path d="M624 320 C700 330 718 352 738 388" fill="none" stroke="#7d77ed" stroke-width="5" stroke-dasharray="12 12" opacity=".75"/><path d="M342 416 C295 458 270 478 238 498" fill="none" stroke="#56bddf" stroke-width="5" stroke-dasharray="12 12" opacity=".75"/>
