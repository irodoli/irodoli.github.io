<g>
 <rect x="525" y="445" width="118" height="92" rx="20" fill="#fff" opacity=".92" stroke="#d5dced"/><text x="584" y="477" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#455571">Browser</text><text x="584" y="502" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#26395f">iPad / PC</text>
