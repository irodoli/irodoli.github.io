<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d">
<title id="t">RollScreenでWindows画面を複数端末へ表示するイメージ</title><desc id="d">Windows PC、iPad、スマートフォン、ノートPCに同じRollScreen画面が広がる構成図。</desc>
<defs>
