 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54c6ef"/><stop offset=".52" stop-color="#7279f4"/><stop offset="1" stop-color="#d46bd7"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".18"/></filter>
</defs>
<rect width="900" height="620" rx="42" fill="url(#bg)"/>
<circle cx="125" cy="100" r="95" fill="#66cbea" opacity=".14"/><circle cx="760" cy="120" r="120" fill="#a17afb" opacity=".12"/>
<g filter="url(#shadow)">
